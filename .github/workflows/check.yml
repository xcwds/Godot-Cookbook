name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot (version from .godot-version)
        run: sudo tools/install_godot.sh

      - name: Install gdtoolkit
        run: pipx install "gdtoolkit==4.*"

      - name: Run checks
        run: tools/check.sh
