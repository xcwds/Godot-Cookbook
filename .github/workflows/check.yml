name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # A full run takes about 3 minutes; each Godot run is also limited by
    # GODOT_TIMEOUT in tools/check.sh.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # actions/cache refuses paths containing "..", so the binary lives in
      # the runner's temp folder, outside the checkout.
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.godot-version') }}

      - name: Install Godot (version from .godot-version, checksum-verified)
        env:
          GODOT_INSTALL_DIR: ${{ runner.temp }}/godot
        run: sudo --preserve-env=GODOT_INSTALL_DIR tools/install_godot.sh

      - name: Install gdtoolkit (version from .gdtoolkit-version)
        run: pipx install "gdtoolkit==$(tr -d '[:space:]' < .gdtoolkit-version)"

      - name: Run checks
        run: tools/check.sh
